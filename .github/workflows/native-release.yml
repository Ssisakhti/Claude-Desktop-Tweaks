name: Draft standalone release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  draft:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache-dependency-path: native/go.sum
      - run: node scripts/build-native-payload.cjs
      - run: go test -race ./...
        working-directory: native
      - run: bash scripts/build-native-release.sh "$GITHUB_REF_NAME"
      - name: Create a draft for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/claude-tweaks_darwin_arm64 dist/claude-tweaks_darwin_amd64 dist/claude-tweaks_linux_arm64 dist/claude-tweaks_linux_amd64 dist/checksums.txt --draft --verify-tag --generate-notes
