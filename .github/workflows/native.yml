name: Standalone terminal installer
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache-dependency-path: native/go.sum
      - run: node scripts/build-native-payload.cjs
      - run: go test -race ./...
        working-directory: native
      - run: go vet ./...
        working-directory: native
      - run: bash scripts/build-native-release.sh test
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-macos-${{ matrix.os }}
          path: |
            dist/claude-tweaks_darwin_*
            dist/checksums.txt
