name: Standalone terminal installer
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache-dependency-path: native/go.sum
      - run: node scripts/build-native-payload.cjs
      - run: go test -race ./...
        working-directory: native
      - run: go vet ./...
        working-directory: native
      - run: bash scripts/build-native-release.sh test
      - name: Windows bootstrap checks
        if: runner.os == 'Windows'
        shell: powershell
        run: ./test/bootstrap-windows.ps1
      - name: Smoke-test Windows executable
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          ./dist/claude-tweaks_windows_amd64.exe --version
          ./dist/claude-tweaks_windows_amd64.exe --help
      - name: Smoke-test native Linux executable
        if: runner.os == 'Linux'
        run: |
          ./dist/claude-tweaks_linux_amd64 --version
          ./dist/claude-tweaks_linux_amd64 --help
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ matrix.os }}
          path: |
            dist/claude-tweaks_darwin_*
            dist/claude-tweaks_linux_*
            dist/claude-tweaks_windows_amd64.exe
            dist/checksums.txt
